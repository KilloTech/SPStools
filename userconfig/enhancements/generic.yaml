enhancements:
  # Palette convertite da UW-SIFT 1.2.0 (CIMSS/SSEC), collezione OAX (NWS).
  # Origine: D:\SIFT_1.2.0\Lib\site-packages\uwsift\data\colormaps\OAX
  # I range min/max sono valori tipici operativi (K/mm/% a seconda del prodotto):
  # per i prodotti che NON produciamo ancora (CAPE, ACTP, ADP, RRQPE, ...) sono
  # stime ragionevoli da verificare quando/se quel prodotto verra' generato.

  oax_cloud_amount_default:
    standard_name: oax_cloud_amount_default
    operations:
      - name: colorize
        method: !!python/name:satpy.enhancements.colormap.colorize
        kwargs:
          palettes:
            - filename: palettes/OAX/cloud_amount_default.npy
              color_scale: 1
              min_value: 0
              max_value: 100
    # Cloud Amount Default | % copertura nuvolosa | 256 colori


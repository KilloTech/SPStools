#
# DWD has many ground pressure charts on https://opendata.dwd.de and EUMETCast
# ----------------------------------------------------------------------------
# dwdc
# The Polar Stereographic Projection (stere) is easy to recognize and optimize.
#
# dwdn, dwda, dwdi
# These three charts all use the same Lambert Conic Conformal Projection (lcc).
# Difficult to optimize the lcc parameters as apparently it uses two parallels.
# I went from ruler and pocket calculator to EXCEL and finally measured pixels
# with Paint. Four pixel y values at lat 70°, 60°, 50°, 40° of a dwdn on a -35°
# central meridian (549, 1155, 1790, 2467) was just the bare minimum information
# needed to feed a homebrew C-program that finally returned  R, lat_1 and lat_2
# using the Levenberg-Marquardt-algorithm (from public domain FORTRAN version of
# Argonne National Laboratories MINPACK, C-translation by Steve Moshier, cleanups
# by Eric A. Welsh and Ernst Lobsiger). Asked DWD hasn't found out what they use.
#


dwdc:
  description: DWD Polar Stereographic (Ground Pressure Overlay)
  projection:
    proj: stere
    ellps: WGS84
    lat_0: 90.0
    lon_0: 10.0
  shape:
    height: 3269
    width:  4379
  area_extent:
    lower_left_xy:  [-8180000.0, -8086000.0]
    upper_right_xy: [ 3920000.0,   933000.0]

dwdn:
  description: DWD Northern Atlantic (Ground Pressure Overlay)
  projection:
    proj: lcc
    ellps: WGS84
    lat_0: 55.0
    lat_1: 82.907573
    lat_2: 89.999999
    lon_0: 10.0
  shape:
    height: 3114
    width:  4389
  area_extent:
    lower_left_xy:  [-5368000.0, -3155000.0]
    upper_right_xy: [ 3075000.0,  2820000.0]


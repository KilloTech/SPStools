
# On top you have a couple of 'areas' I added for the "Satpy Processing System" (SPS) V 4.1
# Many of these are made with stere, WGS84, as simple as possible. Add your own stuff here.

# ------------------------------------------------------------------------------------------------
# EPS_4326 can be used if you experiment  with resampling background images (21600 x 10800 pixels)
# found on the Internet that have no geo location info like *.png and *.tiff (except for GEO-tiff).

EPSG_4326:
   description: Global equal latitude/longitude grid (in Degrees)
   projection:
     init: EPSG:4326
   shape:
     width: 21600
     height: 10800
   area_extent:
     lower_left_xy: [-180.0, -90.0]
     upper_right_xy: [180.0, 90.0]

